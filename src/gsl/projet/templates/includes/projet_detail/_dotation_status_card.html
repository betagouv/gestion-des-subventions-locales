{% load ui_tags %}
<div class="fr-callout fr-background-alt--blue-france callout-without-left-border fr-py-2w fr-px-3w fr-mb-2w">
    <div class="fr-grid-row fr-grid-row--middle">
        <h3 class="fr-h6 fr-mb-0 fr-mr-2w">
            <span class="fr-icon-coin-fill blue-color fr-mr-1w"
                  aria-hidden="true"></span>{{ enveloppe_projet.dotation }} - {{ enveloppe_projet.enveloppe.annee }}
        </h3>
        {% ui_status_badge type=enveloppe_projet.status class="fr-mr-1w" %}
        {% if enveloppe_projet.notification_status %}
            {% ui_status_badge type=enveloppe_projet.notification_status %}
        {% endif %}
    </div>
</div>
