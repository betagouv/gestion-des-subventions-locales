name: Django CI

on:
  push:
    branches: [ "main", "hotfix/*" ]
  pull_request:
    types: [ "opened", "synchronize", "reopened" ]
  merge_group:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Install Dependencies
      run: uv sync

    - name: Check linting
      run: |
        uv run ruff check
        uv run ruff format --check

    - name: Check templates format
      run: uv run djlint . --check

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: bahmutov/npm-install@v1

    - name: Check css format
      run: npm run lint:css

    - name: Check js format
      run: npm run format:js

  tests:
    environment: test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ github.event_name != 'pull_request' && format('postgres://{0}:{1}@{2}:{3}/{4}', vars.DATABASE_USER, vars.DATABASE_PASSWORD, vars.DATABASE_HOST, vars.DATABASE_PORT, vars.DATABASE_NAME) || 'sqlite://:memory:' }}
      SECRET_KEY: ${{ vars.SECRET_KEY }}
      ENV: test

    services:
      postgres:
        image: ${{ github.event_name != 'pull_request' && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: ${{ vars.DATABASE_NAME }}
          POSTGRES_USER: ${{ vars.DATABASE_USER }}
          POSTGRES_PASSWORD: ${{ vars.DATABASE_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Install Dependencies
      run: uv sync

    - name: Check migrations
      run: uv run python manage.py makemigrations --check --dry-run

    - name: Run Tests
      run: uv run python -m pytest --create-db
