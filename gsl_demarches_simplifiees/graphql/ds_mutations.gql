mutation dossierModifierAnnotations($input: DossierModifierAnnotationsInput!) {
  dossierModifierAnnotations(input: $input) {
    annotations {
      id
      updatedAt
    }
    errors {
      message
    }
  }
}

mutation dossierRepasserEnInstruction(
  $input: DossierRepasserEnInstructionInput!
) {
  dossierRepasserEnInstruction(input: $input) {
    clientMutationId
    dossier {
      id
      dateDerniereModification
      state
      traitements {
        id
        dateTraitement
        event
        emailAgentTraitant
      }
    }
    errors {
      message
    }
  }
}

